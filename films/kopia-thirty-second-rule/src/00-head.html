:root{
  --blue:#0D5EF4; --red:#EF2F3C; --navy:#0B1B3A; --logo-white:#FFFFFF;
  --paper:#FBF8F1; --cream:#F3EAD9; --ink:#2A2320; --near-white:#F7F5F0;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#20160F}
#root{position:relative;width:100%;height:100%;overflow:hidden;font-family:"Poppins",system-ui,sans-serif}
.scene{position:absolute;inset:0;overflow:hidden}
.scene svg.art{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
svg text{font-kerning:normal}

/* subtitles: one caption track, centre-bottom of the safe zone */
.cap{position:absolute;inset:0;pointer-events:none}
.capbox{position:absolute;left:40px;width:1000px;top:1392px;display:flex;justify-content:center}
.capbox span{display:block;text-align:center;font:600 44px/1.28 "Poppins",sans-serif;color:var(--near-white);
  background:rgba(11,27,58,.86);padding:14px 30px 16px;border-radius:18px}

/* supers: cut-paper strips near the top of the safe zone */
.sup{position:absolute;inset:0;pointer-events:none}
.supbox{position:absolute;left:70px;width:940px;top:236px;display:flex;flex-direction:column;align-items:center;gap:14px}
.strip{display:block;background:var(--cream);color:var(--navy);font:700 60px/1.12 "Poppins",sans-serif;letter-spacing:-.5px;
  padding:18px 34px 20px;border-radius:6px;box-shadow:0 8px 0 rgba(20,12,6,.22);text-align:center;max-width:940px}
.strip b{color:var(--blue);font-weight:700}
.strip.sm{font-size:50px}

/* overlays */
#grain{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;mix-blend-mode:multiply;opacity:.5;display:block}
.fx{position:absolute;inset:0;pointer-events:none}
</style>
</head>
