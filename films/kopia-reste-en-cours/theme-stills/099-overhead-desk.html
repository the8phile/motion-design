<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>
#stage{background:
  repeating-linear-gradient(92deg, rgba(0,0,0,.045) 0 3px, transparent 3px 19px),
  repeating-linear-gradient(91deg, rgba(255,255,255,.05) 0 2px, transparent 2px 41px),
  linear-gradient(180deg,#C48C57,#B07743 60%,#A86F3C);}
.edge{position:absolute;left:0;right:0;top:1500px;height:420px;background:linear-gradient(180deg,#5E3B1F,#4A2E18);box-shadow:inset 0 14px 30px rgba(0,0,0,.35)}
.edge::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:#D9A26B}
.guide{position:absolute;width:70px;height:70px;border:3px solid rgba(255,248,236,.55)}
.g1{left:40px;top:40px;border-right:0;border-bottom:0}.g2{right:40px;top:40px;border-left:0;border-bottom:0}
.g3{left:40px;bottom:440px;border-right:0;border-top:0}.g4{right:40px;bottom:440px;border-left:0;border-top:0}
.rig{position:absolute;left:130px;top:58px;font:600 24px Mono;letter-spacing:2px;color:#FFF8EC;background:rgba(14,26,43,.55);padding:10px 18px;border-radius:8px}
.rig b{color:#FFC933}
.note{position:absolute;left:70px;top:250px;width:620px;height:860px;transform:rotate(-5deg);display:flex;filter:drop-shadow(0 18px 18px rgba(40,20,5,.35))}
.page{flex:1;background:#FFFDF6;background-image:repeating-linear-gradient(180deg,transparent 0 46px,#BFD3E6 46px 48px);position:relative}
.page:first-child{border-radius:10px 0 0 10px;box-shadow:inset -18px 0 24px -16px rgba(0,0,0,.25)}
.page:last-child{border-radius:0 10px 10px 0;box-shadow:inset 18px 0 24px -16px rgba(0,0,0,.25)}
.scr{position:absolute;left:34px;height:4px;border-radius:2px;background:#2B4A7A;opacity:.75}
.pen{position:absolute;left:520px;top:980px;width:340px;height:26px;border-radius:13px;background:linear-gradient(180deg,#26324a,#0E1A2B);transform:rotate(-28deg);box-shadow:0 10px 10px rgba(40,20,5,.35)}
.pen::after{content:"";position:absolute;right:-26px;top:5px;border-left:30px solid #C9C1B0;border-top:8px solid transparent;border-bottom:8px solid transparent}
.phone{position:absolute;left:770px;top:1080px;z-index:5;width:270px;height:560px;border-radius:44px;background:#11161f;transform:rotate(9deg);padding:12px;box-shadow:0 22px 26px rgba(40,20,5,.4)}
.phone .scr2{width:100%;height:100%;border-radius:34px;background:#1b2536;position:relative;overflow:hidden}
.notif{position:absolute;left:12px;right:12px;top:70px;background:#FFF8EC;border-radius:22px;padding:14px;font:600 19px Inter;color:#0E1A2B;display:flex;gap:10px;align-items:center}
.k{width:46px;height:46px;border-radius:12px;background:#0E1A2B;color:#FFC933;font:800 30px Poppins;display:flex;align-items:center;justify-content:center;flex:none}
.notif small{display:block;font-weight:500;font-size:16px;color:#4a5568}
.pack{position:absolute;left:300px;top:560px;width:560px;height:760px;transform:rotate(3deg)}
.sheet{position:absolute;inset:0;background:#FFFFFF;border-radius:6px;box-shadow:0 2px 3px rgba(0,0,0,.12)}
.s3{transform:translate(14px,16px) rotate(1.4deg);background:#F4F1EA}
.s2{transform:translate(7px,8px) rotate(.7deg);background:#F9F7F2}
.s1{box-shadow:0 30px 34px rgba(40,20,5,.38);padding:60px 54px}
.s1 h1{margin:0;font:800 40px Poppins;color:#0E1A2B;letter-spacing:-.5px}
.s1 h2{margin:6px 0 34px;font:400 26px Poppins;color:#5a6577}
.line{height:12px;border-radius:6px;background:#DDE2EA;margin:0 0 22px}
.staple{position:absolute;left:30px;top:26px;width:44px;height:8px;border-radius:3px;background:#9aa3b0;transform:rotate(-38deg)}
.tag{position:absolute;right:-18px;bottom:70px;background:#FFC933;color:#0E1A2B;font:800 26px Poppins;padding:12px 22px 12px 14px;border-radius:10px 0 0 10px;display:flex;gap:12px;align-items:center;box-shadow:0 6px 10px rgba(0,0,0,.18)}
.tag .k{width:40px;height:40px;font-size:26px;border-radius:10px}
.hand{position:absolute;left:520px;top:-60px;width:420px;height:760px;filter:drop-shadow(0 26px 22px rgba(30,15,5,.45))}
.cap{position:absolute;left:0;right:0;top:1620px;text-align:center;font:800 76px Poppins;color:#FFF8EC;letter-spacing:-1.5px}
.cap span{color:#FFC933}
.sub{position:absolute;left:0;right:0;top:1730px;text-align:center;font:400 34px Poppins;color:rgba(255,248,236,.75)}
</style></head><body>
<div id="stage">
  <div class="edge"></div>
  <div class="guide g1"></div><div class="guide g2"></div><div class="guide g3"></div><div class="guide g4"></div>
  <div class="rig">PLONGÉE 90° · AMPHI B · <b>RANG 7</b></div>

  <div class="note">
    <div class="page"></div><div class="page"></div>
  </div>
  <div class="pen"></div>

  <div class="phone"><div class="scr2">
    <div class="notif"><div class="k">K</div><div>Livré en salle ✓<small>Kopia · maintenant</small></div></div>
  </div></div>

  <div class="pack">
    <div class="sheet s3"></div><div class="sheet s2"></div>
    <div class="sheet s1">
      <div class="staple"></div>
      <h1>Droit civil</h1><h2>Chapitre 4 · 24 pages</h2>
      <div class="line" style="width:92%"></div><div class="line" style="width:84%"></div>
      <div class="line" style="width:96%"></div><div class="line" style="width:70%"></div>
      <div class="line" style="width:88%;margin-top:44px"></div><div class="line" style="width:94%"></div>
      <div class="line" style="width:60%"></div><div class="line" style="width:90%"></div>
      <div class="line" style="width:82%"></div>
      <div class="tag"><div class="k">K</div>kopia</div>
    </div>
  </div>

  <!-- courier's hand + sleeve reaching in from the top edge, fingertips resting on the pack -->
  <svg class="hand" viewBox="0 0 420 760">
    <path d="M150 0 L330 0 L318 360 L168 372 Z" fill="#12A150"/>
    <path d="M150 0 L176 0 L186 368 L168 372 Z" fill="#0E8A43"/>
    <rect x="160" y="340" width="168" height="44" rx="16" fill="#0E1A2B"/>
    <path d="M172 378 C160 470 170 540 206 590 L300 600 C330 540 338 470 322 378 Z" fill="#7A4A2C"/>
    <rect x="186" y="560" width="30" height="150" rx="15" fill="#7A4A2C"/>
    <rect x="222" y="572" width="30" height="168" rx="15" fill="#7A4A2C"/>
    <rect x="258" y="566" width="30" height="160" rx="15" fill="#7A4A2C"/>
    <rect x="292" y="548" width="26" height="128" rx="13" fill="#7A4A2C"/>
    <path d="M176 470 C140 500 128 560 150 600 C160 616 178 610 182 592 C186 556 196 520 206 500 Z" fill="#6B3F24"/>
    <rect x="192" y="690" width="18" height="14" rx="7" fill="#D7B49C" opacity=".7"/>
    <rect x="228" y="718" width="18" height="14" rx="7" fill="#D7B49C" opacity=".7"/>
    <rect x="264" y="704" width="18" height="14" rx="7" fill="#D7B49C" opacity=".7"/>
  </svg>

  <div class="cap">Vous n'avez <span>pas bougé.</span></div>
  <div class="sub">Livré jusqu'à votre place · 200 XAF</div>
</div>
</body></html>
